[package]
name = "hexaris-desktop"
description = "Native Hexaris binary analysis workstation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hexaris"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
hexaris-engine.workspace = true
rfd = "0.15.4"
serde_json.workspace = true
tiny-skia = "0.11"
usvg = { version = "0.45", default-features = false }
resvg = { version = "0.45", default-features = false }

[build-dependencies]
resvg = { version = "0.45", default-features = false }

[lints]
workspace = true
