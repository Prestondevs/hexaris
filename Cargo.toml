[workspace]
members = ["crates/engine", "apps/cli", "apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/Prestondevs/hexaris"

[workspace.dependencies]
hexaris-engine = { path = "crates/engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
